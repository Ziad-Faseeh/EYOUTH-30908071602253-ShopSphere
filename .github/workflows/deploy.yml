name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Backend
      run: |
        if [ -d "Backend" ]; then
          cd Backend && npm install
        elif [ -d "backend" ]; then
          cd backend && npm install
        elif [ -f "package.json" ]; then
          npm install
        else
          echo "No Backend folder or package.json found."
        fi

    - name: Install and Build Frontend
      run: |
        if [ -d "Frontend" ]; then
          cd Frontend && npm install && npm run build --if-present
        elif [ -d "frontend" ]; then
          cd frontend && npm install && npm run build --if-present
        fi
