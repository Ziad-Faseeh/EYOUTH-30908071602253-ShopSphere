name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Safe Install and Build
      run: |
        if [ -f "package.json" ]; then
          npm install
          npm run build --if-present
        elif [ -f "backend/package.json" ]; then
          cd backend && npm install
        elif [ -f "Backend/package.json" ]; then
          cd Backend && npm install
        else
          echo "No package.json found, bypassing build step successfully."
        fi
