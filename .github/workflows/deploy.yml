name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install and Test Backend
      run: |
        if [ -d "Backend" ]; then
          cd Backend
          npm install
        elif [ -d "backend" ]; then
          cd backend
          npm install
        else
          npm install
        fi

    - name: Install and Build Frontend
      run: |
        if [ -d "Frontend" ]; then
          cd Frontend
          npm install
          npm run build --if-present
        elif [ -d "frontend" ]; then
          cd frontend
          npm install
          npm run build --if-present
        fi
